name: Flood-AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest & Linting Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy torch pandas scipy requests flask

    - name: Run Test Suite
      run: |
        python -m pytest tests/ -v
